<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 문장 모음</title>
<style>
  :root {
    --frame: #E2E2E2; --surface: #FFFFFF; --text: #161616; --sub: #595959;
    --line: #E6E6E6; --soft: #F2F2F2; --ink: #161616; --on-ink: #FFFFFF; --shadow: rgba(0,0,0,.14);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --frame: #0F0F0F; --surface: #1A1A1A; --text: #F2F2F2; --sub: #9A9A9A;
      --line: #2C2C2C; --soft: #262626; --ink: #F2F2F2; --on-ink: #161616; --shadow: rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; width: 360px; min-height: 200px; background: var(--frame); color: var(--text);
    font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    font-size: 14px; line-height: 1.55; word-break: keep-all;
  }
  button, input, textarea { font: inherit; color: inherit; }
  svg { flex: none; }
  #app { position: relative; padding: 12px; }
  .pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 11px; cursor: pointer; font-size: 12px; }
  .pill:hover, .pill:focus-visible { background: var(--soft); outline: none; }
  .pill.ink { background: var(--ink); color: var(--on-ink); border-color: var(--ink); font-weight: 700; }
  .pill.ink:hover { opacity: .88; background: var(--ink); }

  .ph { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 10px; gap: 8px; }
  .ph .l { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .ph h1 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; }
  .mark { width: 28px; height: 28px; border-radius: 999px; background: var(--ink); color: var(--on-ink); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .ph .r { display: flex; align-items: center; gap: 8px; }
  .cnt { font-size: 12px; color: var(--sub); }
  .cnt.hot { color: var(--text); font-weight: 700; }
  .add-btn { display: inline-flex; align-items: center; gap: 4px; border: 0; background: var(--ink); color: var(--on-ink); border-radius: 999px; padding: 4px 11px 4px 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .add-btn:hover, .add-btn:focus-visible { opacity: .88; outline: none; }
  .banner { display: flex; gap: 8px; align-items: flex-start; background: var(--surface); border: 1px solid var(--ink); border-radius: 14px; padding: 9px 12px; margin-bottom: 8px; font-size: 12.5px; line-height: 1.5; }
  .banner svg { margin-top: 2px; }
  .search { position: relative; margin-bottom: 8px; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--sub); }
  .search input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px 7px 34px; font-size: 13px; }
  .search input:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
  .plist { display: flex; flex-direction: column; gap: 8px; max-height: 340px; overflow-y: auto; }
  .prow { position: relative; }
  .card { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 70px 12px 14px; cursor: pointer; line-height: 1.55; overflow-wrap: anywhere; }
  .card .t { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card:hover, .card:focus-visible { background: var(--soft); outline: none; }
  .card.hl { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .tag { display: inline-block; margin-top: 6px; padding: 1px 8px; border-radius: 999px; background: var(--ink); color: var(--on-ink); font-size: 11px; font-weight: 700; }
  .acts { position: absolute; top: 8px; right: 8px; display: flex; gap: 2px; }
  .act { width: 28px; height: 28px; border: 0; border-radius: 999px; background: transparent; color: var(--sub); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .act:hover, .act:focus-visible { background: var(--line); color: var(--text); outline: none; }
  .empty, .errbox { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 26px 20px; text-align: center; color: var(--sub); display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .empty strong, .errbox strong { color: var(--text); margin-top: 8px; display: block; }
  .empty .sub { font-size: 12.5px; }
  .empty .pill, .errbox .pill { margin-top: 8px; }
  .pfoot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 6px 0; font-size: 12px; color: var(--sub); }
  .pfoot .lk { display: flex; align-items: center; gap: 6px; }
  .link { border: 0; background: none; color: var(--sub); text-decoration: underline; cursor: pointer; font-size: 12px; padding: 0; white-space: nowrap; }
  .link:hover, .link:focus-visible { color: var(--text); outline: none; }

  .editor { background: var(--surface); border: 2px solid var(--ink); border-radius: 16px; padding: 10px; }
  .editor textarea { width: 100%; min-height: 74px; resize: none; border: 0; background: transparent; color: var(--text); line-height: 1.55; padding: 4px; }
  .editor textarea:focus-visible { outline: none; }
  .editor .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; }
  .editor .count { font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; }
  .editor .count.over { color: var(--text); font-weight: 700; }
  .editor .err { display: none; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; margin-top: 6px; }
  .editor .err.on { display: flex; }
  .editor .btns { display: flex; gap: 6px; }

  .confirm { position: absolute; inset: 0; z-index: 3; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .dialog { background: var(--surface); border-radius: 16px; padding: 18px; width: 100%; }
  .dialog strong { display: block; margin-bottom: 4px; }
  .dialog p { margin: 0 0 14px; color: var(--sub); font-size: 13px; }
  .dialog .btns { display: flex; gap: 8px; justify-content: flex-end; }

  .toast { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 4; display: none; align-items: center; gap: 10px; border-radius: 14px; padding: 10px 14px; font-size: 13px; line-height: 1.45; box-shadow: 0 6px 20px var(--shadow); }
  .toast.on { display: flex; animation: up .18s ease-out; }
  .toast.settled { animation: none; }
  .ver { display: block; font-size: 11px; color: var(--sub); line-height: 1.2; margin-top: 1px; }
  .brand { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; padding: 9px 6px 0; border-top: 1px solid var(--line); font-size: 12px; color: var(--sub); }
  .brand b { color: var(--text); font-weight: 700; }
  .brand .lks { display: flex; gap: 12px; }
  .brand a { color: var(--sub); text-decoration: underline; }
  .brand a:hover, .brand a:focus-visible { color: var(--text); outline: none; }
  .pick h2 { margin: 0 0 2px; font-size: 15px; letter-spacing: -0.02em; }
  .pick > p { margin: 0 0 10px; color: var(--sub); font-size: 12.5px; }
  .pick .lab { font-size: 11.5px; color: var(--sub); margin: 8px 2px 4px; }
  .newcard { background: var(--surface); border: 2px solid var(--ink); border-radius: 14px; padding: 10px 12px; }
  .newcard .t, .opt .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .picklist { display: flex; flex-direction: column; gap: 6px; max-height: 190px; overflow-y: auto; padding: 2px; }
  .opt { display: flex; gap: 10px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 9px 12px; cursor: pointer; }
  .opt.sel { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .opt input { margin-top: 3px; accent-color: var(--ink); }
  .opt .tag { margin-top: 4px; }
  .pick .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  .toast.ok { background: var(--ink); color: var(--on-ink); }
  .toast.warn { background: var(--surface); color: var(--text); border: 2px solid var(--ink); }
  .toast span.m { flex: 1; }
  .toast .tb { border: 0; background: none; color: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; white-space: nowrap; }
  @keyframes up { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

  .skel { height: 58px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); position: relative; overflow: hidden; }
  .skel::before, .skel::after { content: ""; position: absolute; left: 14px; height: 9px; border-radius: 999px; background: var(--line); animation: pulse 1.1s ease-in-out infinite; }
  .skel::before { top: 16px; width: 70%; }
  .skel::after { top: 33px; width: 42%; }
  @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  .help { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .help h2 { margin: 0 0 12px; font-size: 15px; letter-spacing: -0.02em; }
  .help ol { list-style: none; margin: 0 0 14px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .help li { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; }
  .help li b { display: inline-flex; width: 22px; height: 22px; border-radius: 999px; background: var(--ink); color: var(--on-ink); align-items: center; justify-content: center; font-size: 12px; flex: none; }
  .help .sec { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; font-size: 12.5px; color: var(--sub); }
  .help .sec strong { color: var(--text); display: block; margin-bottom: 2px; }
  .help .sec p { margin: 0 0 6px; }
  .help .go { margin-top: 12px; display: flex; justify-content: flex-end; }
</style>
</head>
<body>
  <div id="app"></div>
  <script src="popup.js"></script>
</body>
</html>
